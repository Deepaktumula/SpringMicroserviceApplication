name: Tax Calculator Spring CI/CD to AWS EKS
on:
  workflow_dispatch:
#  push:
#    branches:
#      - main
#    paths:
#      - "src/**"
#      - "app.yml"
#      - "Dockerfile"
#      - "pom.xml"

# Building and Testing, Docker build and push and Deploy AWS EKS -- Stages
# Matrix - allows you to run same no.of jobs multiple times with different configurations and parallel
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service-a, service-b]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set-up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and Test (Maven)
        working-directory: ./${{ matrix.service }}
        run: mvn -B clean verify

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: ./${{ matrix.service }}/target/surefire-reports

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        service:
          - { name: "service-a", docker_name: "tax-service-a", path: "./service-a" }
          - { name: "service-b", docker_name: "tax-service-b", path: "./service-b" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set-up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR for Docker
        working-directory: ${{ matrix.service.path }}
        run: mvn -B clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.docker_name }}:latest
#            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.docker_name }}:${{ github.sha }}

  deploy-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Update Kubeconfig for AWS EKS
        run: |
          aws eks update-kubeconfig --name ${{ secrets.AWS_CLUSTER_NAME }} --region ap-south-1

      - name: Verify the connection to AWS EKS
        run: kubectl get nodes

      - name: Deploy new image to EKS
        run: |
          kubectl apply -f ./service-a/app.yml
          kubectl apply -f ./service-b/app.yml
          
#          kubectl set image deployment/service-a \
#            service-a=${{ secrets.DOCKERHUB_USERNAME }}/tax-service-a:${{ github.sha }}
#
#          kubectl set image deployment/service-b \
#            service-b=${{ secrets.DOCKERHUB_USERNAME }}/tax-service-b:${{ github.sha }}

      - name: Rollout service-a
        run: kubectl rollout status deployment/service-a --timeout=120s

      - name: Rollout service-b
        run: kubectl rollout status deployment/service-b --timeout=120s

      - name: Verify pods and svc
        run: |
          kubectl get pods
          kubectl get svc
